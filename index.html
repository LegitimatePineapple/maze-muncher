<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maze Muncher — Arcade Game</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 20px; background: #090d20; color: #f8fafc;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
  }
  .game { width: min(100%, 560px); text-align: center; }
  h1 { margin: 0 0 6px; color: #ffe45c; letter-spacing: 2px; }
  .subtitle { color: #aab5d1; margin: 0 0 18px; font-size: 14px; }
  .stats { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .stat { flex: 1; background: #151d3b; border: 1px solid #293867; border-radius: 10px; padding: 8px; }
  .stat small { display: block; color: #9eadd2; text-transform: uppercase; font-size: 10px; letter-spacing: 1px; }
  .stat strong { font-size: 20px; }
  .board-wrap { position: relative; }
  canvas { display: block; width: 100%; height: auto; background: #050718; border: 2px solid #3159dd; border-radius: 10px; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; padding: 22px;
    border-radius: 10px; background: rgba(5,7,24,.94);
  }
  .overlay.hidden { display: none; }
  .overlay h2 { margin: 0; color: #ffe45c; font-size: clamp(25px, 7vw, 38px); }
  .overlay p { max-width: 330px; margin: 0; line-height: 1.5; color: #d7def2; }
  button { border: 0; border-radius: 9px; padding: 11px 18px; background: #304fc5; color: white; font-weight: 700; font-size: 15px; cursor: pointer; }
  button:hover { filter: brightness(1.15); }
  .controls { display: flex; justify-content: center; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
  .secondary { background: #35405e; }
  .dpad { display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(2, 42px); gap: 5px; justify-content: center; margin: 12px auto; }
  .dpad button { padding: 0; background: #182449; border: 1px solid #344775; font-size: 20px; touch-action: manipulation; }
  .hint { color: #9eadd2; font-size: 12px; line-height: 1.5; }
</style>
</head>
<body>
<main class="game">
  <h1>MAZE MUNCHER</h1>
  <p class="subtitle">A Pac-Man-inspired arcade game</p>
  <div class="stats">
    <div class="stat"><small>Score</small><strong id="score">0</strong></div>
    <div class="stat"><small>Lives</small><strong id="lives">❤️❤️❤️</strong></div>
    <div class="stat"><small>Level</small><strong id="level">1</strong></div>
  </div>
  <div class="board-wrap">
    <canvas id="board" width="525" height="525" aria-label="Maze Muncher game board"></canvas>
    <section class="overlay" id="overlay">
      <div style="font-size:48px">🟡</div>
      <h2 id="overlayTitle">MAZE MUNCHER</h2>
      <p id="overlayText">Eat all the dots, avoid the ghosts, and grab power pellets to fight back!</p>
      <button id="start">▶ Start Game</button>
    </section>
  </div>
  <div class="controls">
    <button id="pause" class="secondary">Ⅱ Pause</button>
    <button id="restart" class="secondary">↻ Restart</button>
  </div>
  <div class="hint">Move with Arrow keys or WASD. Press Space to pause.</div>
  <div class="dpad" aria-label="Touch controls">
    <span></span><button data-dir="up" aria-label="Up">▲</button><span></span>
    <button data-dir="left" aria-label="Left">◀</button>
    <button data-dir="down" aria-label="Down">▼</button>
    <button data-dir="right" aria-label="Right">▶</button>
  </div>
  <div class="hint">Touch the arrows to play on a phone or tablet.</div>
</main>
<script>
(() => {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const TILE = 25, SIZE = 21;
  const levelMap = [
    "#####################",
    "#.........#.........#",
    "#.###.###.#.###.###.#",
    "#o#...#... ...#...#o#",
    "#.###.#.#####.#.###.#",
    "#.....#...#...#.....#",
    "#####.###.#.###.#####",
    "#......... .........#",
    "#.###.##.###.##.###.#",
    "#...#...........#...#",
    "###.#.##     ##.#.###",
    "#...#...........#...#",
    "#.###.##.###.##.###.#",
    "#......... .........#",
    "#####.###.#.###.#####",
    "#.....#...#...#.....#",
    "#.###.#.#####.#.###.#",
    "#o..#...#...#...#..o#",
    "###.#.###.#.###.#.###",
    "#.........#.........#",
    "#####################"
  ];
  const directions = {up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
  let map, player, ghosts, score=0, lives=3, level=1, power=0, remaining=0;
  let state='ready', last=0, accumulator=0, animation=0;

  function buildMap() {
    map = levelMap.map(row => row.split('').map(c => c === '#' ? '#' : c === 'o' ? 'o' : c === '.' ? '.' : ' '));
    player = {x:10,y:15,dir:'left',next:'left'};
    ghosts = [
      {x:9,y:10,color:'#ff496b',home:[9,10]},
      {x:10,y:10,color:'#40dcf7',home:[10,10]},
      {x:11,y:10,color:'#ff9de2',home:[11,10]},
      {x:10,y:11,color:'#ffae48',home:[10,11]}
    ];
    remaining = map.flat().filter(c => c==='.' || c==='o').length;
    power = 0;
  }
  function wall(x,y) { return x<0 || y<0 || x>=SIZE || y>=SIZE || map[y][x]==='#'; }
  function updateStats() {
    document.getElementById('score').textContent=score;
    document.getElementById('lives').textContent='❤️'.repeat(lives);
    document.getElementById('level').textContent=level;
  }
  function showOverlay(title,message,buttonText) {
    document.getElementById('overlayTitle').textContent=title;
    document.getElementById('overlayText').textContent=message;
    document.getElementById('start').textContent=buttonText;
    document.getElementById('overlay').classList.remove('hidden');
  }
  function hideOverlay() { document.getElementById('overlay').classList.add('hidden'); }
  function resetPositions() {
    player.x=10; player.y=15; player.dir='left'; player.next='left';
    ghosts.forEach(g=>{g.x=g.home[0];g.y=g.home[1]});
    power=0;
  }
  function begin() {
    if(state==='ready'||state==='over'||state==='won') {
      score=0; lives=3; level=1; buildMap(); updateStats();
    }
    state='playing'; hideOverlay(); last=performance.now();
    cancelAnimationFrame(animation); animation=requestAnimationFrame(loop);
  }
  function setDirection(dir) { player.next=dir; }
  function move(entity,dir) {
    const [dx,dy]=directions[dir], nx=entity.x+dx, ny=entity.y+dy;
    if(!wall(nx,ny)){entity.x=nx;entity.y=ny;return true;}
    return false;
  }
  function playerStep() {
    if(move(player,player.next)) player.dir=player.next;
    else move(player,player.dir);
    const tile=map[player.y][player.x];
    if(tile==='.'||tile==='o') {
      score += tile==='o' ? 50 : 10;
      if(tile==='o') power=85;
      map[player.y][player.x]=' ';
      remaining--; updateStats();
    }
    if(remaining===0) {
      level++; buildMap(); updateStats();
    }
  }
  function ghostStep(g) {
    let choices=Object.keys(directions).filter(d=>{
      const [dx,dy]=directions[d];
      return !wall(g.x+dx,g.y+dy);
    });
    if(choices.length>1) {
      const reverse={left:'right',right:'left',up:'down',down:'up'};
      const filtered=choices.filter(d=>d!==reverse[g.dir]);
      if(filtered.length) choices=filtered;
    }
    if(!choices.length)return;
    let chosen;
    if(power>0 || Math.random()<.25) chosen=choices[Math.floor(Math.random()*choices.length)];
    else chosen=choices.slice().sort((a,b)=>{
      const [ax,ay]=directions[a], [bx,by]=directions[b];
      return ((g.x+bx-player.x)**2+(g.y+by-player.y)**2)-((g.x+ax-player.x)**2+(g.y+ay-player.y)**2);
    })[0];
    move(g,chosen);g.dir=chosen;
  }
  function collisions() {
    for(const g of ghosts) {
      if(g.x===player.x && g.y===player.y) {
        if(power>0) {
          score+=200;g.x=g.home[0];g.y=g.home[1];updateStats();
        } else {
          lives--;updateStats();
          if(lives<=0) {
            state='over';showOverlay('GAME OVER',`Final score: ${score}. Want another round?`,'↻ Play Again');
          } else resetPositions();
          return;
        }
      }
    }
  }
  function draw() {
    ctx.fillStyle='#050718';ctx.fillRect(0,0,525,525);
    for(let y=0;y<SIZE;y++) for(let x=0;x<SIZE;x++) {
      const px=x*TILE,py=y*TILE;
      if(map[y][x]==='#') {
        ctx.fillStyle='#101b5a';ctx.fillRect(px+1,py+1,TILE-2,TILE-2);
        ctx.strokeStyle='#3159dd';ctx.lineWidth=1.5;ctx.strokeRect(px+3,py+3,TILE-6,TILE-6);
      } else if(map[y][x]==='.'||map[y][x]==='o') {
        ctx.beginPath();ctx.fillStyle=map[y][x]==='o'?'#ffb34f':'#fff1bd';
        const r=map[y][x]==='o'?4+Math.sin(performance.now()/110)*1.2:2;
        ctx.arc(px+TILE/2,py+TILE/2,r,0,Math.PI*2);ctx.fill();
      }
    }
    ghosts.forEach(g=>{
      const x=(g.x+.5)*TILE,y=(g.y+.5)*TILE;
      ctx.fillStyle=power>0?'#315de8':g.color;
      ctx.beginPath();ctx.arc(x,y,10,Math.PI,0);ctx.lineTo(x+10,y+9);ctx.lineTo(x+5,y+6);ctx.lineTo(x,y+9);ctx.lineTo(x-5,y+6);ctx.lineTo(x-10,y+9);ctx.closePath();ctx.fill();
      ctx.fillStyle='white';ctx.beginPath();ctx.arc(x-4,y-1,3,0,7);ctx.arc(x+4,y-1,3,0,7);ctx.fill();
      ctx.fillStyle='#10152a';ctx.beginPath();ctx.arc(x-4,y,1.5,0,7);ctx.arc(x+4,y,1.5,0,7);ctx.fill();
    });
    const x=(player.x+.5)*TILE,y=(player.y+.5)*TILE;
    const angle={right:0,left:Math.PI,up:-Math.PI/2,down:Math.PI/2}[player.dir]||0;
    const mouth=.18+Math.abs(Math.sin(performance.now()/85))*.28;
    ctx.fillStyle='#ffe333';ctx.beginPath();ctx.moveTo(x,y);
    ctx.arc(x,y,11,angle+mouth,angle+Math.PI*2-mouth);ctx.closePath();ctx.fill();
    if(power>0){ctx.fillStyle='#d9eaff';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText('POWER!',262,16);}
  }
  function loop(now) {
    if(state!=='playing')return;
    const dt=Math.min((now-last)/1000,.05);last=now;accumulator+=dt;
    const step=.13;
    while(accumulator>=step && state==='playing') {
      playerStep();
      ghosts.forEach(ghostStep);
      if(power>0)power--;
      collisions();
      accumulator-=step;
    }
    draw();
    if(state==='playing')animation=requestAnimationFrame(loop);
  }
  function pause() {
    if(state==='playing') {
      state='paused';showOverlay('PAUSED','Your maze is waiting. Take a breather!','▶ Resume');
      document.getElementById('pause').textContent='▶ Resume';
    } else if(state==='paused') {
      state='playing';hideOverlay();document.getElementById('pause').textContent='Ⅱ Pause';
      last=performance.now();animation=requestAnimationFrame(loop);
    }
  }
  document.getElementById('start').addEventListener('click',()=>{
    if(state==='paused')pause();else begin();
  });
  document.getElementById('pause').addEventListener('click',pause);
  document.getElementById('restart').addEventListener('click',()=>{
    state='ready';showOverlay('MAZE MUNCHER','Ready for another round?','▶ Start Game');
    begin();
  });
  document.addEventListener('keydown',e=>{
    const keys={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};
    if(keys[e.key]){e.preventDefault();setDirection(keys[e.key]);}
    if(e.code==='Space'){e.preventDefault();pause();}
  });
  document.querySelectorAll('[data-dir]').forEach(btn=>{
    btn.addEventListener('pointerdown',e=>{e.preventDefault();setDirection(btn.dataset.dir);});
  });
  buildMap();updateStats();draw();
})();
</script>
</body>
</html>
